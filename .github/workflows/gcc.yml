name: ccache compression comparison

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  compare:
    if: github.repository == 'larenspear/ERF'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the ccache version used by ERF Linux CI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/ccache/ccache/releases/download/v4.12.2/ccache-4.12.2-linux-x86_64.tar.xz \
            --output "$RUNNER_TEMP/ccache.tar.xz"
          echo "630c34ec94d451b200f5b14a6a25580d6a45bc80c394b7e0b93e33556eee5d32  $RUNNER_TEMP/ccache.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.12.2-linux-x86_64" >> "$GITHUB_PATH"
          mkdir -p results

      - name: Restore a copy of the fork GCC cache
        id: cpu
        uses: ./.github/actions/ccache-trunk
        with:
          mode: restore
          key: ubuntu-22.04-x64-gcc-mpich-double-particles-on
          path: ${{ runner.temp }}/compression-source-gcc
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare GCC cache entries
        env:
          CACHE_HIT: ${{ steps.cpu.outputs.hit }}
        run: |
          test "$CACHE_HIT" = true
          python3 .github/benchmarks/ccache_compression.py \
            --cache "$RUNNER_TEMP/compression-source-gcc" --label GCC \
            --image-ref ghcr.io/larenspear/erf-ccache:ubuntu-22.04-x64-gcc-mpich-double-particles-on \
            --output results/gcc

      - name: Restore a copy of the fork HIP cache
        id: hip
        uses: ./.github/actions/ccache-trunk
        with:
          mode: restore
          key: ubuntu-22.04-x64-rocm-6.3.2-gfx908-openmpi-double-particles-on
          path: ${{ runner.temp }}/compression-source-hip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare HIP cache entries
        env:
          CACHE_HIT: ${{ steps.hip.outputs.hit }}
        run: |
          test "$CACHE_HIT" = true
          python3 .github/benchmarks/ccache_compression.py \
            --cache "$RUNNER_TEMP/compression-source-hip" --label HIP \
            --image-ref ghcr.io/larenspear/erf-ccache:ubuntu-22.04-x64-rocm-6.3.2-gfx908-openmpi-double-particles-on \
            --output results/hip

      - name: Retain measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ccache-compression-comparison
          path: results/
          retention-days: 14
          if-no-files-found: warn
