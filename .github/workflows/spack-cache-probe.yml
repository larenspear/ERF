name: Spack cache format round trip

on:
  push:
    branches: [spack-cache-format-check]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  round-trip:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable-format-5
            spack: 3e19345b6e12f5ff1b874f4059622fc6a1fd804a
            packages: 01edd466b4da9e0e3c50fe18f58d46dca97e4b97
          - name: development-format-6
            spack: a6a3fdda37828ea6175917eacd4db291df12ec00
            packages: bd7be4aa7f21327cb4af89acc1cb62053b85e5ee
    name: ${{ matrix.name }}
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: spack/setup-spack@v3
        with:
          spack_path: ${{ github.workspace }}/spack_install_dir
          spack_ref: ${{ matrix.spack }}
          packages_ref: ${{ matrix.packages }}
      - name: Configure the matching build cache
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack compiler find
          spack external find --all --not-buildable
          python3 Build/spack/ci_build.py cache
      - name: Build, publish and reinstall a small package from the cache
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack env create --without-view -d cache-check
          spack -e cache-check add zlib@1.3.1
          spack -e cache-check concretize
          spack -e cache-check install --use-buildcache=never --fail-fast
          spack -e cache-check buildcache push --unsigned --update-index erf-buildcache zlib
          spack -e cache-check uninstall --yes-to-all zlib
          spack -e cache-check install --use-buildcache=only --fail-fast
