      run: |
        ctest -L smoke --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build
    - name: Summarize measurements
      if: ${{ always() }}
      env:
        BENCHMARK_RESTORE_HIT: ${{ steps.restore.outputs.hit }}
        BENCHMARK_BUILD_OUTCOME: ${{ steps.build.outcome }}
      run: python3 .github/benchmarks/metrics.py summarize
    - name: Upload benchmark evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-cpu-warm
        retention-days: 14
        path: |
          ${{ env.BENCHMARK_METRICS }}
          ${{ runner.workspace }}/*output*.txt
          ${{ env.BENCHMARK_BUILD }}/Testing/Temporary/*.log
          ${{ env.BENCHMARK_BUILD }}/Tests/**/Backtrace.*
    needs:
    - cpu-cold
  cpu-changed:
    name: cpu-changed
    if: ${{ always() && !cancelled() && github.repository == 'larenspear/ERF' && github.ref == 'refs/heads/ci-ghcr-build-benchmark'
      && needs.cpu-warm.outputs.ready == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
    env:
      CCACHE_TRUNK_KEY: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-cpu
      BENCHMARK_CONFIGURATION: cpu
      BENCHMARK_PHASE: changed
      BENCHMARK_METRICS: ${{ github.workspace }}/benchmark-metrics
      BENCHMARK_BUILD: ${{ github.workspace }}/build
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        persist-credentials: false
    - name: Install Dependencies
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies.sh
    - name: Install CCache
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh
    - name: Record runner and prepare source
      run: python3 .github/benchmarks/metrics.py prepare
    - name: Restore Cache
      id: restore
      uses: ./.github/actions/ccache-trunk
      with:
        mode: restore
        key: ${{ env.CCACHE_TRUNK_KEY }}
        path: ~/.cache/ccache
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify expected cache state
      env:
        ACTUAL_HIT: ${{ steps.restore.outputs.hit }}
      run: test "$ACTUAL_HIT" = "true"
    - name: Configure Project and Generate Build System
      run: |
        date +%s%N > "$BENCHMARK_METRICS/configure-start-ns"
        cmake \
          -B${{runner.workspace}}/ERF/build \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install \
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g1 -DNDEBUG" \
          -DAMReX_ASSERTIONS:BOOL=ON \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_DIM:STRING=3 \
          -DERF_ENABLE_MPI:BOOL=ON \
          -DERF_PARALLEL_TEST_ALLOW_OVERSUBSCRIBE:BOOL=ON \
          '-DERF_PARALLEL_TEST_NRANKS:STRING=1;2;4' \
          -DERF_ENABLE_PARTICLES:BOOL=ON \
          -DERF_PRECISION:STRING=DOUBLE \
          -DERF_PARTICLES_PRECISION:STRING=DOUBLE \
          -DERF_ENABLE_TESTS:BOOL=ON \
          -DERF_ENABLE_ALL_WARNINGS:BOOL=ON \
          -DERF_ENABLE_FCOMPARE:BOOL=ON \
          -DERF_TEST_SDM_SMOKE_GATED:BOOL=ON \
          ${{github.workspace}};

        date +%s%N > "$BENCHMARK_METRICS/configure-end-ns"
    - name: Compile and Link
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=600M
        ccache -z
        ccache --print-stats > "$BENCHMARK_METRICS/ccache-before.txt"
        build_start=$(date +%s)

        date +%s%N > "$BENCHMARK_METRICS/compile-start-ns"
        cmake --build ${{runner.workspace}}/ERF/build --parallel 2 --verbose \
        2>&1 | tee -a ${{runner.workspace}}/build-output.txt;

        date +%s%N > "$BENCHMARK_METRICS/compile-end-ns"
        ccache --print-stats > "$BENCHMARK_METRICS/ccache-after.txt"
