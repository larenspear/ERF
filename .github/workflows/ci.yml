        cmake --build ${{runner.workspace}}/ERF/build --parallel 2 --verbose \
        2>&1 | tee -a ${{runner.workspace}}/build-output.txt;

        date +%s%N > "$BENCHMARK_METRICS/compile-end-ns"
        ccache --print-stats > "$BENCHMARK_METRICS/ccache-after.txt"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        # Keep only what this build used: ccache touches an object on every hit, so
        # anything older than the build is stale. Without this the cache fills with
        # objects from superseded commits, hits its cap, and evicts live objects.
        ccache --evict-older-than "$(( $(date +%s) - build_start + 120 ))s"
        ccache -s | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        du -hs ~/.cache/ccache
      id: build
    - name: Save Cache
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      uses: ./.github/actions/ccache-trunk
      with:
        mode: save
        key: ${{ env.CCACHE_TRUNK_KEY }}
        path: ~/.cache/ccache
        token: ${{ secrets.GITHUB_TOKEN }}
      id: save
    - name: Verify published cache and executable
      id: verify
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.save.outcome == 'success' }}
      run: python3 .github/benchmarks/metrics.py verify
    - name: Report
      run: |
        grep -Ei "warning:|error:" ${{runner.workspace}}/build-output.txt \
          | grep -Ev "Submodules/(amrex|AMReX|googletest)" | grep -Ev "lto-wrapper: warning:" | sort | uniq \
          | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${{runner.workspace}}/build-output-warnings.txt
        cat ${{runner.workspace}}/build-output-warnings.txt
        return=$(tail -n 1 ${{runner.workspace}}/build-output-warnings.txt | awk '{print $2}')
        exit "${return}"
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
    - name: Check Unit Test Registration
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        Tests/Unit/erf_unit_tests --gtest_list_tests | tee ${{runner.workspace}}/unit-test-list.txt
        grep -Eq '^[A-Za-z0-9_].*\.$' ${{runner.workspace}}/unit-test-list.txt
      working-directory: ${{runner.workspace}}/ERF/build
    - name: Run Serial Unit Tests
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        ctest -L unit -j 4 --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build
    - name: Run Parallel Tests
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        ctest -L parallel --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build
    - name: CMake Regression Tests
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
