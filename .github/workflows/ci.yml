name: GHCR transport validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roundtrip:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache test configuration
        shell: bash
        run: |
          printf 'CCACHE_DIR=%s/ccache-smoke\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CCACHE_TRUNK_KEY=transport-check-%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" >> "$GITHUB_ENV"
      - name: Install Linux ccache
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ccache
      - name: Install macOS ccache
        if: runner.os == 'macOS'
        run: brew install ccache
      - name: Install Windows ccache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip -OutFile "$env:RUNNER_TEMP/ccache.zip"
          Expand-Archive "$env:RUNNER_TEMP/ccache.zip" -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Failure tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m unittest discover -s .github/actions/ccache-trunk -p 'test_native.py' -v
          elif [[ "$RUNNER_OS" == Linux ]]; then
            python3 -m unittest discover -s .github/actions/ccache-trunk -p 'test_*.py' -v
          else
            python3 -m unittest discover -s .github/actions/ccache-trunk -p 'test_native.py' -v
          fi
      - name: Populate compiler cache
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then py=python; else py=python3; fi
          "$py" .github/actions/ccache-trunk/smoke.py populate
      - name: Publish cache
        uses: ./.github/actions/ccache-trunk
        with:
          mode: save
          key: ${{ env.CCACHE_TRUNK_KEY }}
          path: ${{ env.CCACHE_DIR }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Empty local cache
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then py=python; else py=python3; fi
          "$py" .github/actions/ccache-trunk/smoke.py empty
      - name: Restore cache
        id: restore
        uses: ./.github/actions/ccache-trunk
        with:
          mode: restore
          key: ${{ env.CCACHE_TRUNK_KEY }}
          path: ${{ env.CCACHE_DIR }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reuse and source invalidation
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restore.outputs.hit }}
        run: |
          test "$CACHE_HIT" = true
          if [[ "$RUNNER_OS" == Windows ]]; then py=python; else py=python3; fi
          "$py" .github/actions/ccache-trunk/smoke.py verify
      - name: Replace cache and check pruning
        uses: ./.github/actions/ccache-trunk
        with:
          mode: save
          key: ${{ env.CCACHE_TRUNK_KEY }}
          path: ${{ env.CCACHE_DIR }}
          token: ${{ secrets.GITHUB_TOKEN }}
  read-only:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore with read-only token
        id: readonly
        uses: ./.github/actions/ccache-trunk
        with:
          mode: restore
          transport: oras
          key: transport-check-windows-x64
          path: ${{ runner.temp }}/readonly-cache
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore anonymously
        id: anonymous
        uses: ./.github/actions/ccache-trunk
        with:
          mode: restore
          transport: oras
          key: transport-check-windows-x64
          path: ${{ runner.temp }}/anonymous-cache
      - name: Require both restores
        env:
          READONLY: ${{ steps.readonly.outputs.hit }}
          ANONYMOUS: ${{ steps.anonymous.outputs.hit }}
        run: test "$READONLY" = true && test "$ANONYMOUS" = true
