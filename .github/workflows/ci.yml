name: Development queue policy check
run-name: Queue policy ${{ github.event_name }} ${{ github.sha }}

on:
  push:
    branches: [ci-latest-development-test]
  workflow_dispatch:

permissions:
  contents: read

# Exact production group; only the protected branch name is mapped for this harness.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || (github.event_name == 'push' && 'latest') || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/ci-latest-development-test' }}

env:
  QUEUE_TEST_REVISION: C
  HOLD_SECONDS: 0

jobs:
  queue-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - name: Hold the active run for newer pushes
        env:
          QUEUE_GROUP: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || (github.event_name == 'push' && 'latest') || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import time
          print(f"revision={os.environ['QUEUE_TEST_REVISION']}", flush=True)
          print(f"commit={os.environ['GITHUB_SHA']}", flush=True)
          print(f"event={os.environ['GITHUB_EVENT_NAME']}", flush=True)
          print(f"group={os.environ['QUEUE_GROUP']}", flush=True)
          for elapsed in range(0, int(os.environ['HOLD_SECONDS']), 15):
              print(f"Still active at {elapsed}s", flush=True)
              time.sleep(15)
          PY
      - name: Record successful completion
        run: |
          printf 'Completed revision %s at %s on %s\n' "$QUEUE_TEST_REVISION" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
