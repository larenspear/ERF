name: GCC regression serial vs parallel benchmark
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: fork-gcc-regression-benchmark
  cancel-in-progress: false
jobs:
  regression:
    if: ${{ github.repository == 'larenspear/ERF' && github.ref == 'refs/heads/ci-gcc-regression-benchmark' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        persist-credentials: false
    - name: Install dependencies
      run: 'Submodules/AMReX/.github/workflows/dependencies/dependencies.sh

        Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh'
    - name: Restore existing fork CPU cache
      id: restore
      uses: larenspear/ERF/.github/actions/ccache-trunk@882356e47106ea4e1c4a19ff96a86986187f3509
      with:
        mode: restore
        key: benchmark-40768145967-1-cpu
        path: ~/.cache/ccache
    - name: Configure particles OFF inventory
      run: "mkdir -p regression-evidence\ncmake \\\n  -B${{runner.workspace}}/ERF/build-off \\\n  -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install\
        \ \\\n  -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \\\n  -DCMAKE_CXX_FLAGS_RELWITHDEBINFO=\"-O2 -g1 -DNDEBUG\"\
        \ \\\n  -DAMReX_ASSERTIONS:BOOL=ON \\\n  -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \\\n  -DERF_DIM:STRING=3 \\\
        \n  -DERF_ENABLE_MPI:BOOL=ON \\\n  -DERF_PARALLEL_TEST_ALLOW_OVERSUBSCRIBE:BOOL=ON \\\n  '-DERF_PARALLEL_TEST_NRANKS:STRING=1;2;4'\
        \ \\\n  -DERF_ENABLE_PARTICLES:BOOL=OFF \\\n  -DERF_ENABLE_UNIT_TESTS:BOOL=OFF \\\n  -DERF_PRECISION:STRING=DOUBLE\
        \ \\\n  -DERF_PARTICLES_PRECISION:STRING=DOUBLE \\\n  -DERF_ENABLE_TESTS:BOOL=ON \\\n  -DERF_ENABLE_ALL_WARNINGS:BOOL=ON\
        \ \\\n  -DERF_ENABLE_FCOMPARE:BOOL=ON \\\n  -DERF_TEST_SDM_SMOKE_GATED:BOOL=ON \\\n  ${{github.workspace}};\n\
        \nctest --test-dir build-off -L regression --show-only=json-v1 > regression-evidence/particles-off-inventory.json"
    - name: Configure particles ON build
      run: "cmake \\\n  -B${{runner.workspace}}/ERF/build \\\n  -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install\
        \ \\\n  -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \\\n  -DCMAKE_CXX_FLAGS_RELWITHDEBINFO=\"-O2 -g1 -DNDEBUG\"\
        \ \\\n  -DAMReX_ASSERTIONS:BOOL=ON \\\n  -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \\\n  -DERF_DIM:STRING=3 \\\
        \n  -DERF_ENABLE_MPI:BOOL=ON \\\n  -DERF_PARALLEL_TEST_ALLOW_OVERSUBSCRIBE:BOOL=ON \\\n  '-DERF_PARALLEL_TEST_NRANKS:STRING=1;2;4'\
        \ \\\n  -DERF_ENABLE_PARTICLES:BOOL=ON \\\n  -DERF_PRECISION:STRING=DOUBLE \\\n  -DERF_PARTICLES_PRECISION:STRING=DOUBLE\
        \ \\\n  -DERF_ENABLE_TESTS:BOOL=ON \\\n  -DERF_ENABLE_ALL_WARNINGS:BOOL=ON \\\n  -DERF_ENABLE_FCOMPARE:BOOL=ON\
        \ \\\n  -DERF_TEST_SDM_SMOKE_GATED:BOOL=ON \\\n  ${{github.workspace}};\n"
    - name: Restore isolated retry build cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ccache
        key: gcc-regression-validation-eba3c4df8-double-particles-on
    - name: Build once
      run: 'export CCACHE_COMPRESS=1 CCACHE_COMPRESSLEVEL=10 CCACHE_MAXSIZE=600M

        ccache -z

        cmake --build build --parallel 2 > regression-evidence/build.log 2>&1

        ccache -s | tee regression-evidence/ccache.txt'
    - name: Save isolated retry build cache
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ccache
        key: gcc-regression-validation-eba3c4df8-double-particles-on
    - name: Audit resources and save pristine inputs
      run: python3 .github/benchmarks/regression.py prepare
    - name: serial
      run: python3 .github/benchmarks/regression.py serial
    - name: Upload serial measurements
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: regression-serial
        retention-days: 14
        path: regression-evidence/serial*
    - name: parallel-1
      run: python3 .github/benchmarks/regression.py parallel-1
    - name: Upload parallel-1 measurements
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: regression-parallel-1
        retention-days: 14
        path: regression-evidence/parallel-1*
    - name: parallel-2
      run: python3 .github/benchmarks/regression.py parallel-2
    - name: Upload parallel-2 measurements
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: regression-parallel-2
        retention-days: 14
        path: regression-evidence/parallel-2*
    - name: Compare selection and outcomes
      run: python3 .github/benchmarks/regression.py compare
    - name: Upload comparison and audit
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: regression-comparison
        retention-days: 14
        path: 'regression-evidence/*.json

          regression-evidence/*.txt

          regression-evidence/build.log

          regression-evidence/input-preflight.log'
