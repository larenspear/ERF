name: Runtime checks

# Merge tier. Four builds of the Linux GCC / OpenMPI DOUBLE configuration with runtime
# checking turned on, running the unit and regression suites:
#   bound-check:   AMReX_BOUND_CHECK=ON, every Array4(i,j,k) access in a kernel is checked
#   sanitizers:    AddressSanitizer + UndefinedBehaviorSanitizer on the whole build
#   fpe-traps:     hardware floating-point traps + abort on unused inputs
#   uninit-stdlib: pattern-initialised memory + libstdc++ debug mode
# All are slower than the plain build (roughly 2x on the tests), which is why they run
# on merge to development rather than on every PR. workflow_dispatch can run one
# variant by name.
on:
  push:
    branches: [development]
    paths-ignore:
      - Docs/**
      - README.rst
      - license.txt
  workflow_dispatch:
    inputs:
      variant:
        description: "Run only this matrix entry (bound-check, sanitizers, fpe-traps, uninit-stdlib); empty = all"
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || github.sha }}-checks
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  plan:
    # The variant table lives here. On a workflow_dispatch with inputs.variant only
    # that entry is kept. The check job receives the result as JSON because a matrix
    # cannot be filtered in place: an include entry that no longer matches an axis
    # value is simply added back as a new combination.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          VARIANT: ${{ github.event.inputs.variant }}
        run: |
          python3 - <<'EOF'
          import json, os, yaml
          variants = yaml.safe_load('''
          - name: bound-check
            cmake_extra: -DAMReX_BOUND_CHECK:BOOL=ON
            cxx_flags: ""
            rwdi_flags: "-O2 -g -DNDEBUG"
            test_opts: ""
            malloc_perturb: ""
            jobs: 4
          - name: sanitizers
            cmake_extra: ""
            cxx_flags: "-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
            # ASan-instrumented compiles need several GB each: four at once ran the 7 GB VM
            # out of memory, and two at once still did at -O2 -g (runner shut down at 41%).
            # -O1 keeps the sanitizer checks, -g1 keeps file:line in reports; both cut
            # compile memory sharply.
            rwdi_flags: "-O1 -g1 -DNDEBUG"
            test_opts: ""
            malloc_perturb: ""
            jobs: 2
          # Hardware FPE traps: a NaN or Inf aborts with a backtrace where it is produced
          # instead of propagating. abort_on_unused_inputs fails a case whose inputs file
          # names a parameter nothing reads (typos, dead parameters).
          - name: fpe-traps
            cmake_extra: ""
            cxx_flags: ""
            rwdi_flags: "-O2 -g -DNDEBUG"
            test_opts: "amrex.fpe_trap_invalid=1 amrex.fpe_trap_zero=1 amrex.fpe_trap_overflow=1 amrex.abort_on_unused_inputs=1"
            malloc_perturb: ""
            jobs: 4
          # Uninitialised memory and standard-library misuse: stack variables start as a
          # garbage pattern (GCC 12+), the heap likewise via MALLOC_PERTURB_, and libstdc++
          # debug mode checks iterators and container bounds.
          - name: uninit-stdlib
            cmake_extra: -DCMAKE_CXX_COMPILER=g++-12
            cxx_flags: "-ftrivial-auto-var-init=pattern -D_GLIBCXX_DEBUG -D_GLIBCXX_DEBUG_PEDANTIC"
            rwdi_flags: "-O2 -g -DNDEBUG"
            test_opts: ""
            malloc_perturb: "165"
            jobs: 4
          ''')
          want = os.environ.get('VARIANT', '')
          picked = [v for v in variants if not want or v['name'] == want]
          assert picked, f"no variant named {want!r}"
          print("running:", ", ".join(v['name'] for v in picked))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("include=" + json.dumps(picked) + "\n")
          EOF

  check:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      # Open MPI leaks at shutdown by design; a leak report would fail every test.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1
      MALLOC_PERTURB_: ${{ matrix.malloc_perturb }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install Dependencies
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies.sh

    - name: Install GCC 12
      if: matrix.name == 'uninit-stdlib'
      run: sudo apt-get install -y --no-install-recommends g++-12

    - name: Install CCache
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh

    # ccache per matrix variant, written only from development; see ci.yml for how it works.
    - name: Restore Cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.name }}-git-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.name }}-git-

    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
          -DAMReX_ASSERTIONS:BOOL=ON \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="${{ matrix.rwdi_flags }}" \
          -DERF_DIM:STRING=3 \
          -DERF_ENABLE_MPI:BOOL=ON \
          -DERF_PARALLEL_TEST_ALLOW_OVERSUBSCRIBE:BOOL=ON \
          '-DERF_PARALLEL_TEST_NRANKS:STRING=1;2;4' \
          -DERF_ENABLE_PARTICLES:BOOL=ON \
          -DERF_ENABLE_TESTS:BOOL=ON \
          -DERF_ENABLE_FCOMPARE:BOOL=ON \
          "-DERF_TEST_EXTRA_RUNTIME_OPTIONS=${{ matrix.test_opts }}" \
          ${{ matrix.cmake_extra }}

    - name: Build
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=600M
        ccache -z
        build_start=$(date +%s)
        set -o pipefail
        cmake --build build --parallel ${{ matrix.jobs }} 2>&1 | tee build-output.txt
        ccache --evict-older-than "$(( $(date +%s) - build_start + 120 ))s"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        ccache -s | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Save Cache
      if: always() && github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.name }}-git-${{ github.sha }}

    - name: Run Serial Unit Tests
      working-directory: build
      run: ctest -L unit -LE parallel --output-on-failure --no-tests=error

    - name: Run Parallel Tests
      working-directory: build
      run: ctest -L parallel --output-on-failure --no-tests=error

    - name: Regression Tests
      working-directory: build
      run: ctest -L regression --output-on-failure --no-tests=error

    - name: Upload backtraces from failed tests
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}-logs
        path: |
          build/Tests/**/Backtrace.*
          build/Tests/**/*.log
        if-no-files-found: ignore
