name: Container images

# Builds the ERF container images (Build/Containerfile) and pushes them to GHCR:
#   ghcr.io/<owner>/erf-dev   build environment + source + ccache
#   ghcr.io/<owner>/erf       erf_exec and its runtime libraries
# Nightly from development (skipped when development has not moved since the
# last image), on release tags, and on demand. Tags: "development" on both;
# "sha-<commit>" on erf, which the prune job keeps for the last 30 builds; the
# release number and "latest" on release tags. The previous erf-dev image's
# ccache seeds each build, so a night's merges recompile only what changed.
# Pull requests build without pushing, and only when they change the
# Containerfile, its bundled example, or this workflow.
on:
  schedule:
    - cron: '0 5 * * *'
  push:
    tags: ['**']
  pull_request:
    paths:
      - Build/Containerfile
      - Build/container-configure.sh
      - Exec/RegTests/ScalarAdvDiff/inputs_advect_uniformU
      - .dockerignore
      - .github/workflows/container.yml
      - .github/workflows/container/**
  workflow_dispatch:
    inputs:
      force:
        description: Build even if an image for this commit exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Push from the schedule, tags and manual runs; a pull request only builds.
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  check:
    name: Image names, and is this commit built already?
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      dev: ${{ steps.names.outputs.dev }}
      runtime: ${{ steps.names.outputs.runtime }}
      built: ${{ steps.built.outputs.built }}
    steps:
      # ghcr.io namespaces are lower case. The owner is erf-model upstream and
      # the user on a fork, so a fork pushes to its own packages.
      - name: Image names
        id: names
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "dev=ghcr.io/${owner}/erf-dev" >> "$GITHUB_OUTPUT"
          echo "runtime=ghcr.io/${owner}/erf" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A nightly or a plain dispatch on a commit that already has an image is
      # skipped; a pull request, a release tag or a forced dispatch always builds.
      - name: Look for this commit's image
        id: built
        env:
          IMAGE: ${{ steps.names.outputs.runtime }}
          FORCE: ${{ inputs.force }}
        run: |
          built=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF_TYPE" != tag ] && [ "$FORCE" != true ] \
             && docker manifest inspect "$IMAGE:sha-${GITHUB_SHA::7}" > /dev/null 2>&1; then
            built=true
            echo "$IMAGE:sha-${GITHUB_SHA::7} exists: nothing to build"
          fi
          echo "built=$built" >> "$GITHUB_OUTPUT"

  images:
    name: erf-dev and erf
    needs: check
    if: needs.check.outputs.built != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      dev_ref: ${{ steps.publish.outputs.dev_ref }}
      runtime_ref: ${{ steps.publish.outputs.runtime_ref }}
    steps:
      # No credentials in .git: the source tree, .git included, is copied into
      # erf-dev (AMReX's buildInfo records the commit from it).
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Free disk space on Ubuntu
        uses: ./.github/actions/free-space-ubuntu

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The previous image's ccache seeds this build. No image (the first run, a
      # fork without one, a PR that cannot read a private package): cold build.
      - name: Seed ccache from the previous erf-dev image
        env:
          DEV_IMAGE: ${{ needs.check.outputs.dev }}:development
        run: |
          mkdir -p ccache-seed
          container=""
          cleanup() {
            if [[ -n "$container" ]]; then
              timeout 15s docker rm "$container" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          if timeout 120s docker pull --quiet "$DEV_IMAGE"; then
            container="erf-seed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if timeout 30s docker create --name "$container" "$DEV_IMAGE" >/dev/null &&
               timeout 60s docker cp "$container:/ccache/." ccache-seed/; then
              echo "seeded from $DEV_IMAGE: $(du -sh ccache-seed | cut -f1)"
            else
              echo "::warning::Could not extract the previous compiler cache; building with available entries"
            fi
          else
            echo "::warning::No previous compiler cache available from $DEV_IMAGE; cold build"
          fi

      - name: Tags and labels for erf-dev
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.check.outputs.dev }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=erf-dev
            org.opencontainers.image.description=ERF CPU build environment, source and compiler cache (GCC, MPICH, double precision, particles)

      - name: Tags and labels for erf
        id: meta-runtime
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.check.outputs.runtime }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=erf
            org.opencontainers.image.description=ERF CPU executable with MPICH, double precision, particles and a runnable example

      # provenance off: a plain single-platform manifest, which every HPC container
      # runtime reads; the default attestation index trips some of them.
      # cache-from + inline: the deps and source layers come from the previous
      # image; the build stage changes every time and is not worth exporting.
      - name: Build erf-dev
        id: build-dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Build/Containerfile
          target: dev
          platforms: linux/amd64
          build-contexts: ccache-seed=ccache-seed
          provenance: false
          load: true
          tags: erf-dev:ci
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=registry,ref=${{ needs.check.outputs.dev }}:development
          cache-to: ${{ env.PUSH == 'true' && 'type=inline' || '' }}

      # The build stage is already done in this job's builder; this adds the
      # runtime stage on top of it.
      - name: Build erf
        id: build-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Build/Containerfile
          target: runtime
          platforms: linux/amd64
          build-contexts: ccache-seed=ccache-seed
          provenance: false
          load: true
          tags: erf:ci
          labels: ${{ steps.meta-runtime.outputs.labels }}
          cache-from: type=registry,ref=${{ needs.check.outputs.runtime }}:development
          cache-to: ${{ env.PUSH == 'true' && 'type=inline' || '' }}

      - name: Run the runtime image with one and two MPI ranks
        timeout-minutes: 5
        run: bash .github/workflows/container/smoke-test.sh erf:ci "$RUNNER_TEMP/runtime-smoke"

      - name: Publish tested images
        id: publish
        if: env.PUSH == 'true'
        env:
          DEV_TAGS: ${{ steps.meta-dev.outputs.tags }}
          RUNTIME_TAGS: ${{ steps.meta-runtime.outputs.tags }}
        run: |
          publish_image() {
            local tag
            while IFS= read -r tag; do
              if [[ -z "$tag" ]]; then continue; fi
              docker tag "$1" "$tag"
              docker push "$tag"
            done <<< "$2"
          }
          publish_image erf-dev:ci "$DEV_TAGS"
          publish_image erf:ci "$RUNTIME_TAGS"
          echo "dev_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' erf-dev:ci)" >> "$GITHUB_OUTPUT"
          echo "runtime_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' erf:ci)" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DEV_TAGS: ${{ steps.meta-dev.outputs.tags }}
          RUNTIME_TAGS: ${{ steps.meta-runtime.outputs.tags }}
          DEV_REF: ${{ steps.publish.outputs.dev_ref }}
          RUNTIME_REF: ${{ steps.publish.outputs.runtime_ref }}
        run: |
          {
            echo "### Container images (pushed: $PUSH)"
            echo '```'
            echo "$DEV_TAGS"
            echo "  $DEV_REF"
            echo "$RUNTIME_TAGS"
            echo "  $RUNTIME_REF"
            echo '```'
            echo "ccache statistics are in the log of the Build erf-dev step."
          } >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    name: Pull and use the published images
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/container
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run the runtime image by digest
        env:
          IMAGE: ${{ needs.images.outputs.runtime_ref }}
        run: |
          docker pull "$IMAGE"
          bash .github/workflows/container/smoke-test.sh "$IMAGE" "$RUNNER_TEMP/runtime-pull-smoke"

      - name: Pull and rebuild the development image by digest
        env:
          IMAGE: ${{ needs.images.outputs.dev_ref }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --env EXPECTED_REVISION="$GITHUB_SHA" "$IMAGE" bash -euo pipefail -c '
            test "$(git -C /erf rev-parse HEAD)" = "$EXPECTED_REVISION"
            ccache -z
            Build/container-configure.sh /erf /erf/build
            cmake --build /erf/build --parallel 4
            ccache -s
          '

  # erf-dev is tagged by name only, so its superseded manifest and any sha-tagged
  # leftover go at once; erf keeps the 30 newest sha-tagged builds plus every
  # named tag. A prune failure never fails the run.
  prune:
    name: Prune old image versions
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/container
      - name: Prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: .github/workflows/container/prune-images.sh erf-dev:0 erf:30
