name: Container images

# Builds the ERF container images (Build/Containerfile) and pushes them to GHCR:
#   ghcr.io/<owner>/erf-dev   build environment + source + build tree + ccache
#   ghcr.io/<owner>/erf       erf_exec and its runtime libraries
# Pushed on every merge to development (tags "development" and "sha-<commit>")
# and on release tags (the release number and "latest"). The previous erf-dev
# image's ccache seeds each build, so a merge recompiles only what changed.
# Pull requests build without pushing, and only when they change the
# Containerfile or this workflow; ci.yml tests the same build on every PR.
on:
  push:
    branches: [development]
    tags: ['**']
    paths:
      - '**'
      - '!Docs/**'
      - '!**.md'
      - '!**.rst'
      - '!license.txt'
      - '!.github/workflows/**'
      - '.github/workflows/container.yml'
      - '.github/workflows/container/**'
  pull_request:
    paths:
      - Build/Containerfile
      - .dockerignore
      - .github/workflows/container.yml
      - .github/workflows/container/**
  workflow_dispatch:

permissions:
  contents: read

# Each merge into development gets its own group (keyed on the commit), so a
# burst of merges never cancels a still-pending development run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

env:
  # Push from development, tags and manual runs; a pull request only builds.
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  images:
    name: erf-dev and erf
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      # No credentials in .git: the source tree, .git included, is copied into
      # erf-dev (AMReX's buildInfo records the commit from it).
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Free disk space on Ubuntu
        uses: ./.github/actions/free-space-ubuntu

      # ghcr.io namespaces are lower case. The owner is erf-model upstream and
      # the user on a fork, so a fork pushes to its own packages.
      - name: Image names
        id: names
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "dev=ghcr.io/${owner}/erf-dev" >> "$GITHUB_OUTPUT"
          echo "runtime=ghcr.io/${owner}/erf" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The previous image's ccache seeds this build. No image (the first run, a
      # fork without one, a PR that cannot read a private package): cold build.
      - name: Seed ccache from the previous erf-dev image
        env:
          DEV_IMAGE: ${{ steps.names.outputs.dev }}:development
        run: |
          mkdir -p ccache-seed
          if docker pull --quiet "$DEV_IMAGE"; then
            id=$(docker create "$DEV_IMAGE")
            docker cp "$id:/ccache/." ccache-seed/
            docker rm "$id" > /dev/null
            echo "seeded from $DEV_IMAGE: $(du -sh ccache-seed | cut -f1)"
          else
            echo "no $DEV_IMAGE to seed from: cold build"
          fi

      - name: Tags and labels for erf-dev
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.dev }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=erf-dev
            org.opencontainers.image.description=ERF build environment, source, build tree and ccache (the ci.yml Linux GCC Particles ON build)

      - name: Tags and labels for erf
        id: meta-runtime
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.runtime }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=erf
            org.opencontainers.image.description=ERF erf_exec with MPICH (the ci.yml Linux GCC Particles ON build)

      # provenance off: a plain single-platform manifest, which every HPC container
      # runtime reads; the default attestation index trips some of them.
      # cache-from + inline: the deps layers come from the previous image; the
      # build layer changes on every merge and is not worth exporting separately.
      - name: Build erf-dev
        id: build-dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Build/Containerfile
          target: dev
          build-contexts: ccache-seed=ccache-seed
          provenance: false
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.names.outputs.dev }}:development
          cache-to: ${{ env.PUSH == 'true' && 'type=inline' || '' }}

      # The dev stage is already built in this job's builder; this adds the
      # runtime stage on top of it.
      - name: Build erf
        id: build-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Build/Containerfile
          target: runtime
          build-contexts: ccache-seed=ccache-seed
          provenance: false
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.names.outputs.runtime }}:development
          cache-to: ${{ env.PUSH == 'true' && 'type=inline' || '' }}

      - name: Summary
        env:
          DEV_TAGS: ${{ steps.meta-dev.outputs.tags }}
          RUNTIME_TAGS: ${{ steps.meta-runtime.outputs.tags }}
          DEV_DIGEST: ${{ steps.build-dev.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.build-runtime.outputs.digest }}
        run: |
          {
            echo "### Container images (pushed: $PUSH)"
            echo '```'
            echo "$DEV_TAGS"
            echo "  $DEV_DIGEST"
            echo "$RUNTIME_TAGS"
            echo "  $RUNTIME_DIGEST"
            echo '```'
            echo "ccache statistics are in the log of the Build erf-dev step."
          } >> "$GITHUB_STEP_SUMMARY"

  # Old sha-tagged and untagged versions pile up at about 2 GB per merge: keep
  # the ten newest plus everything with a named tag. A prune failure never
  # fails the run.
  prune:
    name: Prune old image versions
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/container
      - name: Prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          KEEP: 10
        run: .github/workflows/container/prune-images.sh erf-dev erf
