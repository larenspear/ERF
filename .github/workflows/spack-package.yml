name: Spack package

# ERF's Spack recipe lives in Build/spack (see Docs/sphinx_doc/buildingSpack.rst). This
# workflow keeps it in step with ERF:
#   pins        the submodule commits the recipe pins for @develop are the ones in this tree
#               (seconds; fails when a submodule bump is not followed by the recipe)
#   concretize  every supported variant combination concretizes and every unsupported one is
#               refused with the recipe's own message (minutes, no build)
#   install     representative configurations through `spack install`, then the recipe's
#               stand-alone tests (hours; on merges that touch the recipe, weekly, on demand)
#   macos       the same on a macOS runner with Homebrew's Open MPI, as ERF's macos.yml builds
#   rocm        a compile-only HIP build with ROCm from AMD's apt repository registered as
#               Spack externals, as ERF's hip.yml installs it (no GPU on these runners)
#   sycl        a compile-only SYCL build with Intel oneAPI from apt registered as Spack
#               externals, as ERF's sycl.yml installs it (no GPU on these runners)
# Dependencies come from the project build cache on GHCR after the first run; ERF itself is
# always built. The build lists live in Build/spack/ci_matrix.py. A manual run can build the
# whole matrix at a release (version input) or one spec (spec input), and can point at
# another spack/spack-packages ref to try a dependency recipe change.

on:
  pull_request:
    paths:
      - Build/spack/**
      - spack-repo-index.yaml
      - .gitmodules
      - Submodules/**
      - CMakeLists.txt
      - CMake/**
      - Tests/CMakeLists.txt
      - Tests/Unit/CMakeLists.txt
      - .github/workflows/spack-package.yml
  push:
    branches: [development]
    paths:
      - Build/spack/**
      - spack-repo-index.yaml
      - .gitmodules
      - Submodules/**
      - CMakeLists.txt
      - CMake/**
      - Tests/CMakeLists.txt
      - Tests/Unit/CMakeLists.txt
      - .github/workflows/spack-package.yml
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      spec:
        description: build this one spec instead of the matrix (empty = the matrix)
        default: ""
      version:
        description: build the matrix at this ERF version, e.g. 26.09 (empty = develop)
        default: ""
      packages_ref:
        description: spack/spack-packages git ref (empty = the pinned one)
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || github.sha }}-spack-package-${{ inputs.spec }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

env:
  # Spack v1.2.2 and the spack/spack-packages develop commit the recipe was last validated with.
  SPACK_REF: 3e19345b6e12f5ff1b874f4059622fc6a1fd804a
  PACKAGES_REF: ${{ inputs.packages_ref || '01edd466b4da9e0e3c50fe18f58d46dca97e4b97' }}

jobs:
  pins:
    name: submodule pins
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and trees, no blobs: the release pins are checked against each tag.
          fetch-depth: 0
          filter: blob:none
      - name: Compare the recipe's pins with the tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Build/spack/check_pins.py ${{ github.event_name == 'schedule' && '--strict' || '' }}

  concretize:
    name: concretization sweep
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: spack/setup-spack@v3
        with:
          spack_path: ${{ github.workspace }}/spack_install_dir
          spack_ref: ${{ env.SPACK_REF }}
          packages_ref: ${{ env.PACKAGES_REF }}
      - name: Register the in-tree recipe ahead of builtin
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack repo add "$GITHUB_WORKSPACE/Build/spack/spack_repo/erf"
          spack repo list
          spack compiler find
      - name: Audit and sweep
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack audit packages erf
          python3 Build/spack/erf_sweep.py

  plan:
    name: build matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      install: ${{ steps.matrix.outputs.install }}
      macos: ${{ steps.matrix.outputs.macos }}
      rocm: ${{ steps.matrix.outputs.rocm }}
      sycl: ${{ steps.matrix.outputs.sycl }}
    steps:
      - uses: actions/checkout@v7
      - name: Specs for this run
        id: matrix
        env:
          VERSION: ${{ inputs.version }}
          ONE_SPEC: ${{ inputs.spec }}
        run: |
          matrix=$(python3 Build/spack/ci_matrix.py --version "$VERSION" --spec "$ONE_SPEC")
          echo "$matrix" | python3 -m json.tool
          for job in install macos rocm sycl; do
            echo "$job=$(echo "$matrix" | jq -c ".$job")" >> "$GITHUB_OUTPUT"
          done

  install:
    name: spack install ${{ matrix.spec }}
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.install != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Every variant that changes what is compiled, on development plus pinned releases
        # (Build/spack/ci_matrix.py); a manual run can build one spec or a release instead.
        spec: ${{ fromJSON(needs.plan.outputs.install) }}
    env:
      SPEC: ${{ matrix.spec }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Free up disk space
        uses: ./.github/actions/free-space-ubuntu

      # Both MPIs ERF's CI builds with: Open MPI is Spack's default provider, `^mpich`
      # picks the other (and the non-Open MPI launcher path in the recipe).
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gfortran git python3 unzip \
            libopenmpi-dev openmpi-bin libmpich-dev mpich cmake pkg-config

      - uses: spack/setup-spack@v3
        with:
          spack_path: ${{ github.workspace }}/spack_install_dir
          spack_ref: ${{ env.SPACK_REF }}
          packages_ref: ${{ env.PACKAGES_REF }}

      # Use the runner's compilers, MPI, CMake and Python instead of building them. ERF's
      # other dependencies (AMReX above all) come from the project build cache on GHCR
      # after the first run; ERF itself is always built.
      - name: Register the recipe, externals and the project build cache
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack repo add "$GITHUB_WORKSPACE/Build/spack/spack_repo/erf"
          spack compiler find
          spack external find --all --not-buildable
          spack mirror add --unsigned \
            --oci-username-variable GHCR_USER --oci-password-variable GHCR_TOKEN \
            erf-buildcache oci://ghcr.io/${{ github.repository_owner }}/spack-buildcache

      - name: Recipe checks
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack --version
          spack repo list
          spack audit packages erf
          spack spec -I -N "$SPEC"

      - name: spack install
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack install --verbose --fail-fast "$SPEC"

      # The stand-alone tests run the executable; GPU builds cannot on these runners.
      - name: Stand-alone tests
        if: ${{ !contains(matrix.spec, '+cuda') && !contains(matrix.spec, '+rocm') && !contains(matrix.spec, '+sycl') }}
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack test run --alias erf-ci "$SPEC"

      - name: Stand-alone test logs
        if: ${{ always() && !contains(matrix.spec, '+cuda') && !contains(matrix.spec, '+rocm') && !contains(matrix.spec, '+sycl') }}
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack test results -l erf-ci || true

      # Share the dependencies (not ERF itself, which changes with every commit).
      # Build-only dependencies satisfied from the public cache were never installed
      # here, so pushing them fails; link and run dependencies are what the next
      # run needs.
      - name: Push dependencies to the build cache
        if: always()
        continue-on-error: true
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack buildcache push --unsigned --update-index --only dependencies \
            --without-build-dependencies erf-buildcache "$SPEC"

  macos:
    name: macOS ${{ matrix.spec }}
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.macos != '[]'
    runs-on: macos-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # What macos.yml builds: Apple Clang, MPI on, particles, double and single precision.
        spec: ${{ fromJSON(needs.plan.outputs.macos) }}
    env:
      SPEC: ${{ matrix.spec }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain from Homebrew
        run: brew install open-mpi cmake pkgconf

      - uses: spack/setup-spack@v3
        with:
          spack_path: ${{ github.workspace }}/spack_install_dir
          spack_ref: ${{ env.SPACK_REF }}
          packages_ref: ${{ env.PACKAGES_REF }}

      - name: Register the recipe, externals and the project build cache
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack repo add "$GITHUB_WORKSPACE/Build/spack/spack_repo/erf"
          spack compiler find
          spack external find --all --not-buildable
          spack mirror add --unsigned \
            --oci-username-variable GHCR_USER --oci-password-variable GHCR_TOKEN \
            erf-buildcache oci://ghcr.io/${{ github.repository_owner }}/spack-buildcache

      - name: Recipe checks
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack compiler list
          spack spec -I -N "$SPEC"

      - name: spack install
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack install --verbose --fail-fast "$SPEC"

      - name: Stand-alone tests
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack test run --alias erf-ci "$SPEC"

      - name: Stand-alone test logs
        if: always()
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack test results -l erf-ci || true

      - name: Push dependencies to the build cache
        if: always()
        continue-on-error: true
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack buildcache push --unsigned --update-index --only dependencies \
            --without-build-dependencies erf-buildcache "$SPEC"

  rocm:
    name: ROCm ${{ matrix.spec }}
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.rocm != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # What hip.yml builds (ROCm from AMD's apt repository, gfx908, MPI on, particles)
        # and the radiation build of Build/cmake_with_kokkos_many_hip.sh.
        spec: ${{ fromJSON(needs.plan.outputs.rocm) }}
    env:
      SPEC: ${{ matrix.spec }}
      ROCM_VERSION: "6.3.2"
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Free up disk space
        uses: ./.github/actions/free-space-ubuntu

      # The same ROCm install ERF's hip.yml uses (AMReX's dependency script).
      - name: Install ROCm and the base toolchain
        run: |
          git submodule update --init --depth 1 Submodules/AMReX
          Submodules/AMReX/.github/workflows/dependencies/dependencies_hip.sh "$ROCM_VERSION"
          sudo apt-get install -y --no-install-recommends build-essential gfortran git python3 unzip \
            libopenmpi-dev openmpi-bin cmake pkg-config

      - uses: spack/setup-spack@v3
        with:
          spack_path: ${{ github.workspace }}/spack_install_dir
          spack_ref: ${{ env.SPACK_REF }}
          packages_ref: ${{ env.PACKAGES_REF }}

      # ROCm is registered as externals, like a site installation would be; rocprim and
      # rocThrust are header-only and are built from source by Spack.
      - name: Register the recipe, externals, ROCm and the project build cache
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          source /etc/profile.d/rocm.sh
          spack repo add "$GITHUB_WORKSPACE/Build/spack/spack_repo/erf"
          spack compiler find
          spack external find --all --not-buildable
          spack external find --not-buildable --path "/opt/rocm-$ROCM_VERSION" \
            hip hipcc llvm-amdgpu hsa-rocr-dev comgr rocrand hiprand rocsparse rocfft \
            rocminfo rocm-core rocm-cmake rocm-smi-lib hipsparse rocblas rocsolver hipblas
          spack config get packages | grep -E "^  (hip|hipcc|llvm-amdgpu|hsa-rocr-dev|comgr|rocrand|hiprand|rocsparse|rocfft|rocm-core):" || true
          spack mirror add --unsigned \
            --oci-username-variable GHCR_USER --oci-password-variable GHCR_TOKEN \
            erf-buildcache oci://ghcr.io/${{ github.repository_owner }}/spack-buildcache

      - name: Recipe checks
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack compiler list
          spack spec -I -N "$SPEC"

      - name: spack install
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack install --verbose --fail-fast "$SPEC"

      - name: Push dependencies to the build cache
        if: always()
        continue-on-error: true
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack buildcache push --unsigned --update-index --only dependencies \
            --without-build-dependencies erf-buildcache "$SPEC"

  sycl:
    name: oneAPI SYCL ${{ matrix.spec }}
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.sycl != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # What sycl.yml builds (Intel oneAPI icx/icpx, Intel MPI, particles) and the Aurora
        # configuration of Docs/sphinx_doc/aurora_build_run.rst.
        spec: ${{ fromJSON(needs.plan.outputs.sycl) }}
    env:
      SPEC: ${{ matrix.spec }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Free up disk space
        uses: ./.github/actions/free-space-ubuntu

      # The same oneAPI install ERF's sycl.yml uses (AMReX's dependency script):
      # dpcpp compilers, Fortran, MKL, Intel MPI.
      - name: Install oneAPI and the base toolchain
        run: |
          git submodule update --init --depth 1 Submodules/AMReX
          Submodules/AMReX/.github/workflows/dependencies/dependencies_dpcpp.sh
          sudo apt-get install -y --no-install-recommends build-essential gfortran git python3 unzip \
            cmake pkg-config
          # The runner image's Android NDK carries libc/libm/libstdc++ stubs for other
          # architectures under /usr/local/lib/android. An external with a /usr prefix in
          # the oneAPI build's link set (gcc, which the oneAPI compiler package pulls in
          # for its C++ runtime) has its libraries searched recursively, so every NDK
          # sysroot directory reaches the linker and a hello world no longer links.
          # free-space-ubuntu removes the NDK only when it needs the space; remove it
          # here regardless.
          sudo rm -rf /usr/local/lib/android

      - uses: spack/setup-spack@v3
        with:
          spack_path: ${{ github.workspace }}/spack_install_dir
          spack_ref: ${{ env.SPACK_REF }}
          packages_ref: ${{ env.PACKAGES_REF }}

      # An externally installed oneAPI needs the environment setvars.sh sets (Spack's
      # compiler package only fixes rpaths for a oneAPI it installed itself), so the
      # compilers, MKL, Intel MPI and oneDPL are registered by hand with that environment
      # attached.
      - name: Register the recipe, externals, oneAPI and the project build cache
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack repo add "$GITHUB_WORKSPACE/Build/spack/spack_repo/erf"
          spack compiler find
          spack external find --all --not-buildable
          cc_version=$(basename "$(readlink -f /opt/intel/oneapi/compiler/latest)")
          mkl_version=$(basename "$(readlink -f /opt/intel/oneapi/mkl/latest)")
          mpi_version=$(basename "$(readlink -f /opt/intel/oneapi/mpi/latest)")
          dpl_version=$(basename "$(readlink -f /opt/intel/oneapi/dpl/latest)")
          ls /opt/intel/oneapi/dpl
          test -f "/opt/intel/oneapi/dpl/$dpl_version/lib/cmake/oneDPL/oneDPLConfig.cmake"
          ld_path=$(bash -c 'source /opt/intel/oneapi/setvars.sh --force > /dev/null 2>&1; echo "$LD_LIBRARY_PATH"')
          bin_path=$(bash -c 'source /opt/intel/oneapi/setvars.sh --force > /dev/null 2>&1; echo "$PATH"')
          cat > oneapi-externals.yaml <<EOF
          packages:
            intel-oneapi-compilers:
              buildable: false
              externals:
              - spec: intel-oneapi-compilers@${cc_version}
                prefix: /opt/intel/oneapi
                extra_attributes:
                  compilers:
                    c: /opt/intel/oneapi/compiler/${cc_version}/bin/icx
                    cxx: /opt/intel/oneapi/compiler/${cc_version}/bin/icpx
                    fortran: /opt/intel/oneapi/compiler/${cc_version}/bin/ifx
                  environment:
                    prepend_path:
                      LD_LIBRARY_PATH: "${ld_path}"
                      PATH: "${bin_path}"
            intel-oneapi-mkl:
              buildable: false
              externals:
              - spec: intel-oneapi-mkl@${mkl_version}
                prefix: /opt/intel/oneapi
            intel-oneapi-mpi:
              buildable: false
              externals:
              - spec: intel-oneapi-mpi@${mpi_version}
                prefix: /opt/intel/oneapi
            intel-oneapi-dpl:
              buildable: false
              externals:
              - spec: intel-oneapi-dpl@${dpl_version}
                prefix: /opt/intel/oneapi
          EOF
          spack config add -f oneapi-externals.yaml
          spack config get packages | grep -A14 -E "^  intel-oneapi-compilers:" || true
          spack mirror add --unsigned \
            --oci-username-variable GHCR_USER --oci-password-variable GHCR_TOKEN \
            erf-buildcache oci://ghcr.io/${{ github.repository_owner }}/spack-buildcache

      - name: Recipe checks
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack compiler list
          spack spec -I -N "$SPEC"

      - name: spack install
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack install --verbose --fail-fast --keep-stage "$SPEC"

      # What a failed AMReX configure saw: the compiler and library paths Spack set up and
      # the CMake compiler-check transcript (CMakeConfigureLog.yaml since CMake 3.26).
      - name: Build environment and CMake log of a failed AMReX build
        if: failure()
        run: |
          stage=$(find /tmp/runner/spack-stage -maxdepth 1 -name 'spack-stage-amrex-*-*' 2>/dev/null | head -1); echo "stage=$stage"
          if [ -n "$stage" ]; then
            grep -E "^(export )?(PATH|LD_LIBRARY_PATH|CC|CXX|FC|SPACK_CC|SPACK_CXX|SPACK_LINK_DIRS|SPACK_RPATH_DIRS|SPACK_INCLUDE_DIRS)=" "$stage/spack-build-env.txt" | cut -c1-500
            log=$(find "$stage" -name CMakeConfigureLog.yaml 2>/dev/null | head -1); echo "log=$log"
            if [ -n "$log" ]; then awk '/CMAKE_HAVE_LIBC_PTHREAD/{p=1} p' "$log" | head -80 | cut -c1-400; fi
            out=$(find "$stage" -maxdepth 1 -name spack-build-out.txt | head -1); [ -n "$out" ] && grep -n -E "error|Error|cannot|undefined|not found" "$out" | head -10 | cut -c1-300
          fi

      - name: Push dependencies to the build cache
        if: always()
        continue-on-error: true
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack buildcache push --unsigned --update-index --only dependencies \
            --without-build-dependencies erf-buildcache "$SPEC"
