name: Spack containers

# Runnable ERF images on GHCR from the Spack recipe in Build/spack.
# erf is the CPU image on ubuntu:22.04; erf-cuda is the same stack for CUDA sm80
# on NVIDIA's runtime image, which supplies the CUDA libraries. Tags: development
# and the latest release, plus a dated tag that never moves. A release tag builds
# that release. The first push creates a private package; make
# ghcr.io/<owner>/erf and erf-cuda public once.

on:
  schedule:
    - cron: '0 8 * * 1'   # Mondays 08:00 UTC
  push:
    tags: ['2[0-9].[0-9][0-9]']
  workflow_dispatch:
    inputs:
      spec:
        description: one spec instead of the image list (root +cuda selects erf-cuda; cuda_arch=80 and ^mpich~cuda required)
        default: ""
      tag:
        description: image tag for that spec (empty = the version the spec names, with -sm80 for CUDA)
        default: ""
      base_image:
        description: base image for the CPU Spack layers (may be pinned by digest)
        default: "ubuntu:22.04"

permissions:
  contents: read
  packages: write

concurrency:
  group: spack-containers-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Spack and spack-packages refs of gcc-rrtmgp.yml, which fills the build cache read here.
  SPACK_REF: cd657f2c90770f5722715f6a0f95d7a5a359359b
  PACKAGES_REF: fa11df3be41f58bac19b73346422e06b103ee5b5
  # ^mpich~cuda: the image MPI is not CUDA-aware. The plan check rejects +cuda.
  IMAGE_OPTIONS: "+netcdf +noahmp +rrtmgp +fft +particles ^mpich~cuda"
  # The toolkit installed on the runner and the base image must carry the same CUDA release.
  CUDA_VERSION: "12.8"
  CUDA_BASE: nvidia/cuda:12.8.1-runtime-ubuntu22.04
  CUDA_ARCH: "80"
  # The plan check fails if erf, amrex, or kokkos is not this GCC.
  GCC_VERSION: "12"

jobs:
  plan:
    name: image list
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      date: ${{ steps.matrix.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Images for this run
        id: matrix
        shell: bash
        env:
          ONE_SPEC: ${{ inputs.spec }}
          ONE_TAG: ${{ inputs.tag }}
          CPU_BASE: ${{ inputs.base_image || 'ubuntu:22.04' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY' > matrix.txt
          import datetime, json, os, re
          from pathlib import Path

          options, cpu_base = os.environ["IMAGE_OPTIONS"], os.environ["CPU_BASE"]
          cuda, cuda_base, arch = os.environ["CUDA_VERSION"], os.environ["CUDA_BASE"], os.environ["CUDA_ARCH"]
          sha = os.environ["SHA"]
          def tag_of(version):
              return "development" if version == "develop" else version
          # Development images build the commit that triggered the run, not the branch tip
          # at the moment Spack clones it. A release builds its checksummed tarball.
          def erf_version(version):
              return f"git.{sha}=develop" if version == "develop" else version
          def cpu(version):
              return {"spec": f"erf@{erf_version(version)} {options}", "tag": tag_of(version),
                      "image": "erf", "base": cpu_base, "cuda": "", "max_gb": 2}
          # 8 GB on disk. The checked image was 7.1 GB; a cached toolkit layer made 10.2 GB.
          def gpu(version):
              return {"spec": f"erf@{erf_version(version)} +cuda cuda_arch={arch} {options} ^cuda@{cuda}",
                      "tag": f"{tag_of(version)}-sm{arch}", "image": "erf-cuda", "base": cuda_base,
                      "cuda": cuda, "max_gb": 8}
          def root_section(spec):
              return spec.split("^", 1)[0]
          def root_has_cuda(spec):
              return any(re.search(r"(?:^|\+)cuda(?:$|[+~])", token) for token in root_section(spec).split())
          def mpich_tilde_cuda(spec):
              return re.search(r"\^mpich(?:@[^\s^]+)?~cuda(?:\s|$|[+~])", spec) or \
                  re.search(r"\^mpich(?:@[^\s^]+)?\s+~cuda(?:\s|$)", spec)

          if os.environ["ONE_SPEC"]:
              spec = os.environ["ONE_SPEC"].strip()
              if re.match(r"erf@develop\b", spec):
                  spec = re.sub(r"^erf@develop\b", f"erf@git.{sha}=develop", spec, count=1)
              version = re.match(r"erf@([^\s+~^%]+)", spec)
              inferred = tag_of(version.group(1).split("=")[-1]) if version else ""
              named = os.environ["ONE_TAG"]
              if not mpich_tilde_cuda(spec):
                  raise SystemExit("pin ^mpich~cuda; this image's MPI is not CUDA-aware")
              if root_has_cuda(spec):
                  archs = [token.split("=", 1)[1] for token in root_section(spec).split() if token.startswith("cuda_arch=")]
                  if archs != [arch]:
                      raise SystemExit(f"a CUDA image must set cuda_arch={arch} on the root spec, not {archs or 'an implicit arch'}")
                  if not re.search(r"(?:^|\s)\^cuda(?:@|\s|$)", spec):
                      spec += f" ^cuda@{cuda}"
                  tag = named or (f"{inferred}-sm{arch}" if inferred else "")
                  image, base, cuda_field, max_gb = "erf-cuda", cuda_base, cuda, 8
              else:
                  tag = named or inferred
                  image, base, cuda_field, max_gb = "erf", cpu_base, "", 2
              if not tag:
                  raise SystemExit("the spec names no version; pass a tag")
              images = [{"spec": spec, "tag": tag, "image": image, "base": base, "cuda": cuda_field, "max_gb": max_gb}]
          elif os.environ["REF_TYPE"] == "tag":
              images = [cpu(os.environ["REF_NAME"]), gpu(os.environ["REF_NAME"])]
          else:
              recipe = Path("Build/spack/spack_repo/erf/packages/erf/package.py").read_text()
              releases = re.findall(r'\(\s*"(\d{2}\.\d{2})",\s*"[0-9a-f]{64}"', recipe)
              latest = max(releases, key=lambda v: tuple(int(x) for x in v.split(".")))
              images = [cpu("develop"), cpu(latest), gpu("develop"), gpu(latest)]
          print("images=" + json.dumps(images))
          print("date=" + datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d"))
          PY
          cat matrix.txt
          cat matrix.txt >> "$GITHUB_OUTPUT"

  images:
    name: ${{ matrix.image.image }}:${{ matrix.image.tag }}
    needs: plan
    # Must match the base images' Ubuntu release (glibc).
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      SPEC: ${{ matrix.image.spec }}
      TAG: ${{ matrix.image.tag }}
      DATED_TAG: ${{ matrix.image.tag }}-${{ needs.plan.outputs.date }}
      # Not a published tag. Deleted before the job ends. The dated tag is pushed
      # only after the contract check, from the labeled local image.
      SCRATCH_TAG: unchecked-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image.tag }}
      CHECKED_IMAGE: erf-contract
      BASE_IMAGE: ${{ matrix.image.base }}
      CUDA: ${{ matrix.image.cuda }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # dependencies_nvcc.sh lives in the AMReX submodule.
      - uses: actions/checkout@v7
        with:
          submodules: ${{ matrix.image.cuda != '' }}
          persist-credentials: false

      - name: Image name
        env:
          IMAGE_NAME: ${{ matrix.image.image }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Free up disk space
        uses: ./.github/actions/free-space-ubuntu

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gfortran git python3 unzip \
            cmake pkg-config
          sudo mkdir -p /opt/software && sudo chown "$(id -u):$(id -g)" /opt/software

      - name: Install the CUDA toolkit
        if: matrix.image.cuda != ''
        run: |
          Submodules/AMReX/.github/workflows/dependencies/dependencies_nvcc.sh "$CUDA"
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          /usr/local/cuda/bin/nvcc --version | grep -q "release $CUDA," \
            || { echo "::error::the runner's toolkit is not CUDA $CUDA"; exit 1; }

      - uses: spack/setup-spack@v3
        with:
          spack_path: ${{ github.workspace }}/spack_install_dir
          spack_ref: ${{ env.SPACK_REF }}
          packages_ref: ${{ env.PACKAGES_REF }}

      # The build cache must not supply cuda: a cached toolkit becomes an image layer.
      # ERF's git URL is this repository, so erf@git.<sha> resolves on a fork as well.
      - name: Register the recipe, the build tools, the build cache and the image registry
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack repo add "$GITHUB_WORKSPACE/Build/spack/spack_repo/erf"
          spack config add "config:install_tree:root:/opt/software"
          spack config add "packages:all:target:[x86_64_v3]"
          cat > erf-packages.yaml <<EOF
          packages:
            all:
              prefer: ["%gcc@$GCC_VERSION"]
            erf:
              package_attributes:
                git: $REPOSITORY_URL
          EOF
          cat > erf-concretizer.yaml <<'EOF'
          concretizer:
            reuse:
              roots: true
              from:
              - type: local
              - type: buildcache
                exclude: [cuda]
              - type: external
          EOF
          spack config add -f erf-packages.yaml
          spack config add -f erf-concretizer.yaml
          spack compiler find
          spack external find --not-buildable \
            cmake gmake git python perl pkgconf autoconf automake libtool m4 bison flex
          if [ -n "$CUDA" ]; then
            spack external find --not-buildable cuda
          fi
          spack mirror add --unsigned \
            --oci-username-variable GHCR_USER --oci-password-variable GHCR_TOKEN \
            erf-buildcache oci://ghcr.io/${{ github.repository_owner }}/spack-buildcache
          spack mirror add --unsigned \
            --oci-username-variable GHCR_USER --oci-password-variable GHCR_TOKEN \
            erf-images "oci://$IMAGE"

      - name: Concretize and check the plan
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack spec -I -l "$SPEC" | tee concretized.txt
          spack spec --json "$SPEC" > concretized.json
          python3 - <<'PY'
          import json, os, re
          nodes = json.load(open("concretized.json"))["spec"]["nodes"]
          by_hash = {n.get("hash"): n for n in nodes}
          by_name = {}
          for n in nodes:
              by_name.setdefault(n["name"], []).append(n)
          cuda, toolkit, arch, gcc = (os.environ[k] for k in ("CUDA", "CUDA_VERSION", "CUDA_ARCH", "GCC_VERSION"))
          problems = []
          def compiler_of(node):
              found = None
              for edge in node.get("dependencies", []):
                  virtuals = edge.get("virtuals") or edge.get("parameters", {}).get("virtuals") or []
                  if "cxx" in virtuals or "c" in virtuals:
                      dep = by_hash.get(edge["hash"], {})
                      found = f"{edge['name']}@{dep.get('version', '?')}"
                      if "cxx" in virtuals:
                          return found
              return found or "none"
          def accepts_gcc(compiler):
              return compiler == f"gcc@{gcc}" or compiler.startswith(f"gcc@{gcc}.")
          for name in ("erf", "amrex", "kokkos"):
              found = by_name.get(name, [])
              if not found:
                  problems.append(f"{name} is not in the plan")
                  continue
              for node in found:
                  compiler = compiler_of(node)
                  if not accepts_gcc(compiler):
                      problems.append(f"{name} would compile with {compiler}, not gcc {gcc}")
          for node in by_name.get("ekat", []):
              compiler = compiler_of(node)
              if not accepts_gcc(compiler):
                  problems.append(f"ekat would compile with {compiler}, not gcc {gcc}")
          mpich_tokens = re.findall(r"mpich@[^\s\]]+", open("concretized.txt").read())
          if not mpich_tokens:
              problems.append("mpich is not in the concretized spec")
          for token in mpich_tokens:
              pinned_off = "~cuda" in token or "cuda=False" in token or "cuda=false" in token
              if "+cuda" in token or not pinned_off:
                  problems.append(f"mpich is not ~cuda: {token}")
          if cuda:
              found = by_name.get("cuda", [])
              if len(found) != 1:
                  problems.append(f"{len(found)} cuda nodes in the plan")
              else:
                  if not found[0].get("external"):
                      problems.append("cuda is not the runner's toolkit: Spack would build it or take a cached copy, which becomes an image layer")
                  if not str(found[0]["version"]).startswith(toolkit):
                      problems.append(f"cuda {found[0]['version']} is not the {toolkit} release the base image carries")
              amrex = by_name["amrex"][0].get("parameters", {})
              archs = [str(a) for a in amrex.get("cuda_arch", [])]
              if not amrex.get("cuda") or arch not in archs:
                  problems.append(f"amrex is not +cuda cuda_arch={arch}: cuda={amrex.get('cuda')} cuda_arch={archs}")
          elif "cuda" in by_name:
              problems.append("a CPU image depends on cuda")
          for problem in problems:
              print(f"::error::{problem}")
          raise SystemExit(1 if problems else 0)
          PY

      - name: spack install
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack install --verbose --fail-fast "$SPEC"

      # GHCR sometimes answers a manifest upload with 403; a repeat push only redoes the manifests.
      - name: Push an unchecked image
        id: scratch
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          for attempt in 1 2 3; do
            if spack buildcache push --unsigned --without-build-dependencies \
                 --base-image "$BASE_IMAGE" --tag "$SCRATCH_TAG" erf-images "$SPEC"; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Log in and pull the unchecked image
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker pull --quiet "$IMAGE:$SCRATCH_TAG"

      # NVIDIA's base image prints a banner before every command unless the entrypoint is cleared.
      - name: Label the local image
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          TITLE: ${{ matrix.image.image }}
        run: |
          printf 'FROM %s\nENTRYPOINT []\nCMD ["/bin/bash"]\n' "$IMAGE:$SCRATCH_TAG" | docker build --provenance=false \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$TAG" \
            --label "org.opencontainers.image.title=$TITLE" \
            --label "org.opencontainers.image.description=ERF: $SPEC" \
            -t "$CHECKED_IMAGE" -

      # No GPU here. A CUDA executable is loaded against the toolkit's driver stub,
      # which proves every other library resolves. It does not run the solver.
      - name: Run the image
        run: |
          if [ -z "$CUDA" ]; then
            docker run --rm "$CHECKED_IMAGE" erf_exec --help
            docker run --rm "$CHECKED_IMAGE" bash -c '
              set -e
              prefix=$(dirname "$(dirname "$(command -v erf_exec)")")
              mkdir -p /tmp/run && cd /tmp/run
              cp -r "$prefix/share/erf/examples/ScalarAdvDiff/." .
              mpiexec -n 2 erf_exec inputs_advect_uniformU max_step=2 erf.plot_int_1=-1 erf.check_int=-1'
          else
            mkdir -p stub && cp /usr/local/cuda/lib64/stubs/libcuda.so stub/libcuda.so.1
            docker run --rm -v "$PWD/stub:/stub:ro" -e LD_LIBRARY_PATH=/stub "$CHECKED_IMAGE" bash -c '
              set -e
              missing=$(ldd "$(command -v erf_exec)" | grep "not found" || true)
              if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
              erf_exec --help'
          fi

      - name: Check the image contract
        env:
          MAX_GB: ${{ matrix.image.max_gb }}
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p image-record
          stub=()
          if [ -n "$CUDA" ]; then stub=(-v "$PWD/stub:/stub:ro" -e LD_LIBRARY_PATH=/stub); fi
          develop=0
          case "$SPEC" in
            *"=develop"*) develop=1 ;;
          esac
          if ! docker run --rm "${stub[@]}" "$CHECKED_IMAGE" erf_exec --describe-json > image-record/description.json 2> image-record/describe-stderr.txt; then
            if [ "$develop" -eq 1 ]; then
              echo "::error::development image did not write --describe-json"
              cat image-record/describe-stderr.txt
              exit 1
            fi
            echo "::notice::erf_exec --describe-json is not available in $SPEC"
            cat image-record/describe-stderr.txt
            rm -f image-record/description.json
          fi
          docker image inspect "$CHECKED_IMAGE" --format '{{json .Config.Entrypoint}}' > entrypoint.txt
          docker run --rm "$CHECKED_IMAGE" true > no-op-output.txt
          docker run --rm "$CHECKED_IMAGE" sh -c 'echo "${CUDA_VERSION:-}"' > cuda-in-image.txt
          docker image inspect "$CHECKED_IMAGE" --format '{{.Size}}' > size-bytes.txt
          docker image inspect "$CHECKED_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' > revision-label.txt
          docker image inspect "$CHECKED_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}' > version-label.txt
          python3 - <<'PY'
          import json, os, pathlib, re
          cuda, toolkit, spec, max_gb, revision, tag = (
              os.environ[k] for k in ("CUDA", "CUDA_VERSION", "SPEC", "MAX_GB", "REVISION", "TAG"))
          problems = []
          entrypoint = pathlib.Path("entrypoint.txt").read_text().strip()
          if entrypoint not in ("null", "[]"):
              problems.append(f"the image has an entrypoint {entrypoint}; commands would not run as given")
          output = pathlib.Path("no-op-output.txt").read_text()
          if output:
              problems.append("a no-op command printed output, so a banner would precede every run: " + output.strip().splitlines()[0])
          in_image = pathlib.Path("cuda-in-image.txt").read_text().strip()
          if cuda and not in_image.startswith(toolkit + "."):
              problems.append(f"the base image carries CUDA {in_image or 'none'}, the toolkit is {toolkit}")
          size_gb = int(pathlib.Path("size-bytes.txt").read_text()) / 1e9
          if size_gb > float(max_gb):
              problems.append(f"the image is {size_gb:.1f} GB on disk, over its {max_gb} GB budget")
          labeled = pathlib.Path("revision-label.txt").read_text().strip()
          if labeled != revision:
              problems.append(f"revision label is {labeled or 'empty'}, not the commit that triggered the run")
          if pathlib.Path("version-label.txt").read_text().strip() != tag:
              problems.append("version label is not the published tag")
          description = pathlib.Path("image-record/description.json")
          if "=develop" in spec and not description.exists():
              problems.append("a development image did not write --describe-json")
          if description.exists():
              d = json.loads(description.read_text())
              if d.get("gpu_backend") != ("cuda" if cuda else "none"):
                  problems.append(f"the executable reports gpu_backend {d.get('gpu_backend')}")
              features = d.get("features", {})
              if features.get("mpi") is not True:
                  problems.append("the executable does not report mpi")
              missing = [t[1:] for t in spec.split() if t.startswith("+") and t[1:] in features and not features[t[1:]]]
              if missing:
                  problems.append("the executable was built without " + ", ".join(missing))
              if "=develop" in spec:
                  source = d.get("source_describe") or ""
                  if not re.fullmatch(r"[0-9a-f]{12,40}", source) or not revision.startswith(source):
                      problems.append(f"source_describe {source!r} is not the commit that triggered the run")
          for problem in problems:
              print(f"::error::{problem}")
          raise SystemExit(1 if problems else 0)
          PY

      - name: Publish the dated tag
        run: |
          docker tag "$CHECKED_IMAGE" "$IMAGE:$DATED_TAG"
          docker push --quiet "$IMAGE:$DATED_TAG"

      - name: Record the image
        run: |
          docker image inspect "$IMAGE:$DATED_TAG" --format '{{index .RepoDigests 0}}' | tee image-record/digest.txt
          docker image inspect "$IMAGE:$DATED_TAG" --format '{{len .RootFS.Layers}} layers, {{.Size}} bytes' | tee image-record/size.txt
          printf '### %s\n\n- spec: `%s`\n- digest: `%s`\n- %s\n' "$IMAGE:$DATED_TAG" "$SPEC" \
            "$(cat image-record/digest.txt)" "$(cat image-record/size.txt)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image.image }}-${{ matrix.image.tag }}-${{ needs.plan.outputs.date }}
          path: image-record
          if-no-files-found: error

      # The moving tag advances only after the dated tag has been published.
      - name: Move the ${{ matrix.image.tag }} tag
        run: |
          docker tag "$IMAGE:$DATED_TAG" "$IMAGE:$TAG"
          docker push --quiet "$IMAGE:$TAG"

      - name: Delete the unchecked tag
        if: always() && steps.scratch.outcome == 'success'
        env:
          IMAGE_NAME: ${{ matrix.image.image }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          token = os.environ["GHCR_TOKEN"]
          package = os.environ["IMAGE_NAME"]
          tag = os.environ["SCRATCH_TAG"]
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def request(method, url):
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()
          bases = [
              f"https://api.github.com/orgs/{owner}/packages/container/{package}/versions",
              f"https://api.github.com/users/{owner}/packages/container/{package}/versions",
              f"https://api.github.com/user/packages/container/{package}/versions",
          ]
          base = None
          for candidate in bases:
              status, body = request("GET", candidate + "?per_page=100")
              if status == 200:
                  base = candidate
                  break
          if base is None:
              raise SystemExit(f"cannot list versions of {package}: {status} {body[:300]!r}")
          version_id = None
          for attempt in range(5):
              status, body = request("GET", base + "?per_page=100")
              if status != 200:
                  raise SystemExit(f"cannot list versions of {package}: {status} {body[:300]!r}")
              versions = json.loads(body)
              for version in versions:
                  tags = (version.get("metadata") or {}).get("container", {}).get("tags") or []
                  if tag in tags:
                      version_id = version["id"]
                      break
              if version_id is not None:
                  break
              time.sleep(5)
          if version_id is None:
              raise SystemExit(f"unchecked tag {tag} was not found to delete")
          for attempt in range(3):
              status, body = request("DELETE", f"{base}/{version_id}")
              if status in (200, 204):
                  print(f"deleted unchecked tag {tag}")
                  raise SystemExit(0)
              time.sleep(5)
          raise SystemExit(f"failed to delete unchecked tag {tag}: {status} {body[:300]!r}")
          PY

      - name: Push dependencies to the build cache
        if: always()
        continue-on-error: true
        run: |
          . spack_install_dir/share/spack/setup-env.sh
          spack buildcache push --unsigned --update-index --only dependencies \
            --without-build-dependencies erf-buildcache "$SPEC"
