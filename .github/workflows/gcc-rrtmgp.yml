name: Linux GCC NetCDF RRTMGP

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-linux-gcc
  cancel-in-progress: true

jobs:
  library:
    name: GNU@9.3 C++17 Release - NetCDF ${{matrix.netcdf}} - Particles ${{matrix.particles}} - RRTMGP ${{matrix.rrtmgp}}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    # env: {CXXFLAGS: "-fno-operator-names -Werror -Wall -Wextra -Wpedantic -Wnull-dereference -Wfloat-conversion -Wshadow -Woverloaded-virtual"}
    strategy:
      matrix:
        particles: [OFF, ON]
        netcdf: [OFF, ON]
        rrtmgp: [OFF, ON]
        exclude:
        - rrtmgp: ON
          netcdf: OFF

    steps:

    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Dependencies
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies.sh

    - name: Install CCache
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh

    - name: Set Up Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: Setup Spack
      uses: spack/setup-spack@v2

    - name: set up NetCDF
      run: |
        . /home/runner/work/ERF/ERF/spack/share/spack/setup-env.sh
        spack env create erf_netcdf
        spack env activate erf_netcdf
        spack add netcdf-c netcdf-fortran parallel-netcdf hdf5 openmpi
        spack concretize -f
        spack install
        mkdir -p /tmp/spack_view
        spack view add -i /tmp/spack_view hdf5 netcdf-c netcdf-fortran parallel-netcdf openmpi

    #- name: Push packages and update index
    #  env:
    #    GITHUB_USER: ${{ github.actor }}
    #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #  run:
    #    spack env activate erf_netcdf
    #    spack buildcache push --base-image ubuntu:22.04 --update-index -d ./local-buildcache $(spack find --format "{hash}")
    #  if: ${{ !cancelled() }}

    - name: Configure Project and Generate Build System
      run: |
        . /home/runner/work/ERF/ERF/spack/share/spack/setup-env.sh
        spack env activate erf_netcdf
        export HDF5_ROOT=$(spack location -i hdf5)
        export NETCDF_INCLUDE=$(nc-config --includedir)
        export NETCDF_LIB=$(nc-config --libdir)
        cmake \
          -B${{runner.workspace}}/ERF/build \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install \
          -DCMAKE_BUILD_TYPE:STRING=Debug \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_DIM:STRING=3 \
          -DERF_ENABLE_MPI:BOOL=ON \
          -DERF_ENABLE_PARTICLES:BOOL=${{matrix.particles}} \
          -DERF_ENABLE_NETCDF:BOOL=${{matrix.netcdf}} \
          -DERF_ENABLE_HDF5:BOOL=${{matrix.netcdf}} \
          -DERF_ENABLE_KOKKOS:BOOL=ON \
          -DHDF5_ROOT=${HDF5_ROOT} \
          -DERF_ENABLE_EKAT:BOOL=${{matrix.rrtmgp}} \
          -DERF_ENABLE_RRTMGP:BOOL=${{matrix.rrtmgp}} \
          -DERF_ENABLE_TESTS:BOOL=ON \
          -DERF_ENABLE_ALL_WARNINGS:BOOL=ON \
          -DERF_ENABLE_FCOMPARE:BOOL=ON \
          -DNETCDF_ROOT=${NETCDF_ROOT} \
          -DNETCDF_INCLUDE_DIR=${NETCDF_INCLUDE} \
          -DNETCDF_LIBRARY=${NETCDF_LIB}/libnetcdf.so \
          -DNETCDF_ROOT=/tmp/spack_view \
          -DNetCDF_INCLUDE_DIR=${NETCDF_INCLUDE} \
          -DNetCDF_C_LIBRARY=${NETCDF_LIB}/libnetcdf.so \
          -DRRTMGP_ENABLE_NETCDF=ON \
          -DRRTMGP_NETCDF_ROOT=${NETCDF_ROOT} \
          -DRRTMGP_NETCDF_INCLUDE_DIR=${NETCDF_INCLUDE} \
          -DCMAKE_CXX_FLAGS="-I${NETCDF_INCLUDE}" \
          -DCMAKE_C_FLAGS="-I${NETCDF_INCLUDE}" \
          -DCMAKE_INCLUDE_SYSTEM_FLAG_CXX="-isystem " \
          ${{github.workspace}};

    - name: Compile and Link
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=300M
        ccache -z

        cmake --build ${{runner.workspace}}/ERF/build --parallel 2 --verbose \
        2>&1 | tee -a ${{runner.workspace}}/build-output.txt;

        ccache -s
        du -hs ~/.cache/ccache

    - name: Report
      run: |
        egrep "warning:|error:" ${{runner.workspace}}/build-output.txt \
          | egrep -v "Submodules/amrex" | egrep -v "lto-wrapper: warning:" | sort | uniq \
          | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${{runner.workspace}}/build-output-warnings.txt
        cat ${{runner.workspace}}/build-output-warnings.txt
        export return=$(tail -n 1 ${{runner.workspace}}/build-output-warnings.txt | awk '{print $2}')
        exit ${return}

    - name: CMake Tests # see file ERF/Tests/CTestList.cmake
      run: |
        ctest -L regression -VV
      working-directory: ${{runner.workspace}}/ERF/build
