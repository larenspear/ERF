name: Linux GCC NetCDF RRTMGP

run-name: NetCDF/RRTMGP serial versus parallel regression comparison

on:
  workflow_dispatch:

# Development pushes finish the active run and keep only the newest pending commit.
# PR cancellation and commit-specific manual groups stay unchanged.
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || (github.event_name == 'push' && 'latest') || github.sha }}-linux-gcc-rrtmgp
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  library:
    name: GNU@9.3 C++17 - NetCDF ${{matrix.netcdf}} - Particles ${{matrix.particles}} - RRTMGP ${{matrix.rrtmgp}}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    # env: {CXXFLAGS: "-fno-operator-names -Werror -Wall -Wextra -Wpedantic -Wnull-dereference -Wfloat-conversion -Wshadow -Woverloaded-virtual"}
    strategy:
      fail-fast: false
      matrix:
        particles: [ON]
        netcdf: [ON]
        rrtmgp: [ON]
    env:
      CCACHE_TRUNK_KEY: ubuntu-22.04-x64-gcc-spack-openmpi-double-particles-on-kokkos-netcdf-${{ matrix.netcdf }}-rrtmgp-${{ matrix.rrtmgp }}
      ERF_DIR: ${{ github.workspace }}/erf_clone
    steps:

    - uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false
        path: erf_clone

    - name: Install Dependencies
      run: ${ERF_DIR}/Submodules/AMReX/.github/workflows/dependencies/dependencies.sh

    - name: Install CCache
      run: ${ERF_DIR}/Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh

    - name: Free up disk space
      uses: ./erf_clone/.github/actions/free-space-ubuntu

    # GHCR trunk per configuration; the old Actions cache seeds the first restore.
    - name: Restore Cache
      id: ghcr-cache
      uses: ./erf_clone/.github/actions/ccache-trunk
      with:
        mode: restore
        key: ${{ env.CCACHE_TRUNK_KEY }}
        path: ~/.cache/ccache
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Restore legacy Actions cache
      if: steps.ghcr-cache.outputs.hit != 'true'
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.netcdf }}-${{ matrix.rrtmgp }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.netcdf }}-${{ matrix.rrtmgp }}-git-

    - name: Setup Spack
      uses: spack/setup-spack@v3
      with:
        spack_path: ${{ github.workspace }}/spack_install_dir
        spack_ref: cd657f2c90770f5722715f6a0f95d7a5a359359b
        packages_ref: fa11df3be41f58bac19b73346422e06b103ee5b5

    - name: Install CA certificates
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates
        sudo update-ca-certificates

    - name: set up NetCDF
      run: |
        echo ${{ github.workspace }}
        echo "$RUNNER_TEMP"
        . ${{ github.workspace }}/spack_install_dir/share/spack/setup-env.sh
        export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
        export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
        export CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
        spack env create erf_netcdf
        spack env activate erf_netcdf
        spack config add "packages:all:require:target=x86_64_v3"
        spack config add "packages:all:providers:mpi:[openmpi]"
        spack add netcdf-c netcdf-fortran parallel-netcdf hdf5 openmpi
        spack concretize -f --fresh
        spack mirror add --unsigned \
          --oci-username-variable GHCR_USER --oci-password-variable GHCR_TOKEN \
          erf-buildcache oci://ghcr.io/${{ github.repository_owner }}/spack-buildcache
        spack install --deprecated
        spack find -lv openmpi hdf5 netcdf-c parallel-netcdf
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Project and Generate Build System
      run: |
        . ${{ github.workspace }}/spack_install_dir/share/spack/setup-env.sh
        spack env activate erf_netcdf
        HDF5_ROOT=$(spack location -i hdf5); export HDF5_ROOT
        NETCDF_ROOT=$(spack location -i netcdf-c); export NETCDF_ROOT
        cmake \
          -B${ERF_DIR}/build \
          -DCMAKE_INSTALL_PREFIX:PATH=${ERF_DIR}/install \
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g1 -DNDEBUG" \
          -DAMReX_ASSERTIONS:BOOL=ON \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_DIM:STRING=3 \
          -DERF_ENABLE_MPI:BOOL=ON \
          -DERF_PARALLEL_TEST_ALLOW_OVERSUBSCRIBE:BOOL=ON \
          '-DERF_PARALLEL_TEST_NRANKS:STRING=1;2;4' \
          -DERF_ENABLE_PARTICLES:BOOL=${{matrix.particles}} \
          -DERF_ENABLE_NETCDF:BOOL=${{matrix.netcdf}} \
          -DERF_ENABLE_HDF5:BOOL=${{matrix.netcdf}} \
          -DERF_ENABLE_KOKKOS:BOOL=ON \
          -DHDF5_ROOT=${HDF5_ROOT} \
          -DNETCDF_ROOT=${NETCDF_ROOT} \
          -DERF_ENABLE_EKAT:BOOL=${{matrix.rrtmgp}} \
          -DERF_ENABLE_RRTMGP:BOOL=${{matrix.rrtmgp}} \
          -DERF_ENABLE_TESTS:BOOL=ON \
          -DERF_ENABLE_ALL_WARNINGS:BOOL=ON \
          -DERF_ENABLE_FCOMPARE:BOOL=ON \
          ${ERF_DIR};

    - name: Compile and Link
      shell: bash
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        ccache -z
        build_start=$(date +%s)

        cmake --build ${ERF_DIR}/build --parallel 2 --verbose \
        2>&1 | tee -a ${ERF_DIR}/build-output.txt;

        echo '```' >> "$GITHUB_STEP_SUMMARY"
        ccache --evict-older-than "$(( $(date +%s) - build_start + 120 ))s"
        ccache -s | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        du -hs ~/.cache/ccache

    - name: Record comparison environment
      shell: bash
      run: |
        mkdir -p "${ERF_DIR}/benchmark-metadata"
        git -C "$ERF_DIR" rev-parse HEAD > "${ERF_DIR}/benchmark-metadata/commit.txt"
        git -C "$ERF_DIR" submodule status --recursive > "${ERF_DIR}/benchmark-metadata/submodules.txt"
        lscpu > "${ERF_DIR}/benchmark-metadata/cpu.txt"
        free -m > "${ERF_DIR}/benchmark-metadata/memory.txt"
        cmake --version > "${ERF_DIR}/benchmark-metadata/cmake.txt"
        ctest --version > "${ERF_DIR}/benchmark-metadata/ctest.txt"
        env | grep -E '^(OMP_|CTEST_|OMPI_|PMIX_|ImageOS=|ImageVersion=)' > "${ERF_DIR}/benchmark-metadata/runtime-env.txt" || true
        cp "${ERF_DIR}/build/CMakeCache.txt" "${ERF_DIR}/benchmark-metadata/"
        . "${{ github.workspace }}/spack_install_dir/share/spack/setup-env.sh"
        spack env activate erf_netcdf
        spack find -lv > "${ERF_DIR}/benchmark-metadata/spack-specs.txt"
        cp "$SPACK_ENV/spack.lock" "${ERF_DIR}/benchmark-metadata/"

    - name: Compare regression scheduling
      shell: bash
      run: |
        python3 "${ERF_DIR}/.github/scripts/rrtmgp-regression-benchmark.py" \
          "${ERF_DIR}/build" "${ERF_DIR}/regression-benchmark" "$(nproc)"

    - name: Upload comparison evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rrtmgp-regression-comparison
        path: |
          ${{ github.workspace }}/erf_clone/regression-benchmark
          !${{ github.workspace }}/erf_clone/regression-benchmark/pristine-inputs/**
          ${{ github.workspace }}/erf_clone/benchmark-metadata
          ${{ github.workspace }}/erf_clone/build-output.txt
          ${{ github.workspace }}/erf_clone/build/Testing
          ${{ github.workspace }}/erf_clone/build/Tests/**/*.log
          ${{ github.workspace }}/erf_clone/build/Tests/**/Backtrace.*
        retention-days: 7
